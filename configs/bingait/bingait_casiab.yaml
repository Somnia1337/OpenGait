data_cfg:
  dataset_name: CASIA-B
  dataset_root: ../datasets/CASIA-B-pkl
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  num_workers: 1
  remove_no_gallery: false
  test_dataset_name: CASIA-B

model_cfg:
  model: BinGait
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 2, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 74
    in_channels: 256
    parts_num: 16
  bin_num: [16]
  hash_dim: 512

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 62700
  save_name: BinGait
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered
    frames_all_limit: 720
  metric: hamming
  transform:
    - type: BaseSilCuttingTransform
  cross_view_gallery: false

loss_cfg:
  - type: HashLoss
    loss_term_weight: 1.0
    log_prefix: hash

trainer_cfg:
  enable_float16: true
  fix_BN: true
  sync_BN: true
  restore_ckpt_strict: false
  optimizer_reset: true
  save_name: BinGait
  with_test: false
  grad_accum_steps: 4
  sampler:
    type: TripletSampler
    sample_type: fixed_unordered
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_num_max: 40
    frames_num_min: 20
  transform:
    - type: Compose
      trf_cfg:
        - type: BaseSilCuttingTransform
        - type: RandomRotate
          prob: 0.4
        - type: RandomErasing
          prob: 0.4

  restore_hint: 60000
  log_iter: 100
  save_iter: 100
  total_iter: 61200

  # restore_hint: 60800
  # log_iter: 100
  # save_iter: 100
  # total_iter: 61800

  # restore_hint: 61800
  # log_iter: 100
  # save_iter: 100
  # total_iter: 62200

  # restore_hint: 62200
  # log_iter: 100
  # save_iter: 100
  # total_iter: 62600

  # restore_hint: 62600
  # log_iter: 100
  # save_iter: 100
  # total_iter: 63000

optimizer_cfg:
  lr: 0.0002
  # lr: 0.0001
  # lr: 0.00004
  # lr: 0.00002
  # lr: 0.00001
  momentum: 0.9
  solver: Adam
  weight_decay: 0.0000005
  # weight_decay: 0.0
